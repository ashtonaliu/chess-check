name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  engine-core:
    name: Native engine correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.99.1 fmt --check --manifest-path engine-core/Cargo.toml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine-core/target/
          key: ${{ runner.os }}-engine-core-1.99.1-${{ hashFiles('engine-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-engine-core-1.99.1-
      - run: rustup run 1.99.1 bash scripts/check_engine_core.sh
      - run: cargo +1.99.1 clippy --locked --all-targets --manifest-path engine-core/Cargo.toml -- -D warnings

  lichess-ingest:
    name: Lichess ingest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: cargo +1.99.1 fmt --check --manifest-path tools/lichess-ingest/Cargo.toml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/lichess-ingest/target/
          key: ${{ runner.os }}-lichess-ingest-1.99.1-${{ hashFiles('tools/lichess-ingest/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lichess-ingest-1.99.1-
      - run: cargo +1.99.1 test --locked --manifest-path tools/lichess-ingest/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path tools/lichess-ingest/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2 duckdb 'pyarrow>=18' pytest requests
      - run: python -m pytest -q tests/test_lichess_dataset.py
        env:
          LICHESS_INGEST_BIN: tools/lichess-ingest/target/debug/lichess-ingest

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stockfish
      - name: Install Python dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Run Python tests
        run: python -m pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check neural find-rate parity across Python, ONNX and TypeScript
        run: |
          npm ci --prefix web
          python scripts/check_neural_find_rate.py
          python scripts/check_neural_find_rate.py --precision float16

  web:
    name: Web tests and builds
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Rust WebAssembly target and wasm-bindgen
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          release=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          curl --retry 3 -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$release.tar.gz" -o "$RUNNER_TEMP/$release.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$release.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
      - name: Install web dependencies and run tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run test:wasm
          npm run build
      - name: Build the extension
        run: scripts/build_extension.sh

  extension-e2e:
    name: Chromium extension tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Rust WebAssembly target and wasm-bindgen
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          release=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          curl --retry 3 -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$release.tar.gz" -o "$RUNNER_TEMP/$release.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$release.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
      - name: Install dependencies and run the extension suite
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium --no-shell
          npm run test:e2e
