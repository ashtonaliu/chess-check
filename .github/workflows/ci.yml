name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lichess-ingest:
    name: Lichess ingest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 test --locked --manifest-path tools/lichess-ingest/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path tools/lichess-ingest/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2 duckdb 'pyarrow>=18' pytest requests
      - run: python -m pytest -q tests/test_lichess_dataset.py
        env:
          LICHESS_INGEST_BIN: tools/lichess-ingest/target/debug/lichess-ingest

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stockfish
      - name: Install Python dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q -rs

  web:
    name: Web tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and run tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the extension
        run: scripts/build_extension.sh
