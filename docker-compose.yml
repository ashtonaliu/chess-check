# Full app with MySQL as the analysis store and the coach's SQL backend.
#   cp .env.example .env    # then set the passwords
#   docker compose up --build
# Open http://localhost:8080. For MySQL alone (local development):
#   docker compose up -d mysql
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      WF_WRITER_PASSWORD: ${WF_WRITER_PASSWORD:?set WF_WRITER_PASSWORD in .env}
      WF_READER_PASSWORD: ${WF_READER_PASSWORD:?set WF_READER_PASSWORD in .env}
    volumes:
      - ./deploy/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"     # local only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  app:
    build: .
    environment:
      WF_SQL_BACKEND: mysql
      WF_MYSQL_WRITER_URL: mysql://wf_writer:${WF_WRITER_PASSWORD}@mysql:3306
      WF_MYSQL_READER_URL: mysql://wf_reader:${WF_READER_PASSWORD}@mysql:3306
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
