[package]
name = "engine-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1"
shakmaty = "0.30"

[profile.test]
opt-level = 3
