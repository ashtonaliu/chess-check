<!doctype html>
<!-- Development harness (not packaged): runs the cube and the analysis page in one
     normal tab, with stand-ins for the Chrome APIs. ?tab=<chess.com URL> simulates
     the page the cube is on, ?callback=<path to a saved game endpoint response>
     stands in for Chess.com's game endpoint (which a page on localhost cannot call;
     leave it out to simulate a game in progress), and ?me= is the signed-in user. -->
<html lang="en"><head><meta charset="utf-8"><title>Chess Check cube (dev)</title>
<style>body { margin: 0; height: 100vh; background: #302e2b; color: #ddd; font: 14px system-ui; padding: 16px; }</style></head>
<body>
  <p>Simulated page: <code id="sim"></code></p>
  <script>
    const tab = new URLSearchParams(location.search).get("tab") || "https://www.chess.com/home";
    document.getElementById("sim").textContent = tab;
    window.__wfPageUrl = tab;
    const q = new URLSearchParams(location.search);
    window.__wfCallback = async () => q.get("callback") ? (await fetch(q.get("callback"))).json() : null;
    window.__wfSignedIn = q.get("me") ?? "";
    window.chrome = {
      runtime: { getURL: p => new URL(p, location.href).href,
                 sendMessage: async msg => { while (!window.__wfHandle) await new Promise(r => setTimeout(r, 50)); return window.__wfHandle(msg); },
                 onMessage: { addListener() {} } },
      storage: { local: { get: async keys => Object.fromEntries(keys.map(k => [k, JSON.parse(localStorage.getItem("wf:" + k) ?? "null") ?? undefined])),
                          set: async o => { for (const [k, v] of Object.entries(o)) localStorage.setItem("wf:" + k, JSON.stringify(v)); } } },
    };
  </script>
  <script type="module">
    // load the analysis page's code first, without its chrome.runtime listener
    const real = window.chrome; window.chrome = { runtime: { getURL: real.runtime.getURL } };
    await import("./dist/offscreen.js");
    window.chrome = real;
    const s = document.createElement("script"); s.src = "dist/content.js"; document.body.appendChild(s);
  </script>
</body></html>
